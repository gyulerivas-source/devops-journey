services:
  backend:
    image: python:alpine
    command:
      - sh
      - -c
      - |
        echo "{\"nodo\": \"$$(hostname)\", \"status\": \"online\"}" > index.html
        python -m http.server 5000
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "8085:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
