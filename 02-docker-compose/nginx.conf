events {}

http {
    server {
        listen 80;

        # 127.0.0.11 es la IP fija del DNS interno de Docker
        resolver 127.0.0.11 valid=5s;

        location / {
            # Pasar el destino por variable obliga a Nginx a resolver dinámicamente
            set $upstream_app backend;
            proxy_pass http://$upstream_app:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
